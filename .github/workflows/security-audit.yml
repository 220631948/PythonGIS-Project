name: Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  owasp-zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: kartoza/postgis:15-3.4
        env:
          POSTGRES_DB: geohub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend server
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/geohub_test
          SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -s http://localhost:8000/health; do sleep 1; done'
          echo "Backend started successfully"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 7

  dependency-scan-backend:
    name: Backend Dependency Scan (Safety)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check
        run: |
          # Check installed packages for known vulnerabilities
          pip install -r requirements.txt
          safety check --json --output safety-report.json || true

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 7

  dependency-scan-frontend:
    name: Frontend Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 7

  bandit-scan:
    name: Python Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            || true

          # Also generate human-readable output
          bandit -r app/ \
            -f txt \
            -o bandit-report.txt \
            --severity-level medium \
            --confidence-level medium \
            || true

      - name: Display Bandit results
        run: cat bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 7

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sql-injection-tests:
    name: SQL Injection Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run SQL injection tests
        run: |
          pytest tests/test_security_sql_injection.py -v --tb=short

  security-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [owasp-zap-scan, dependency-scan-backend, dependency-scan-frontend, bandit-scan, secret-scan, sql-injection-tests]
    if: always()

    steps:
      - name: Check security scan results
        run: |
          echo "OWASP ZAP Scan: ${{ needs.owasp-zap-scan.result }}"
          echo "Backend Dependency Scan: ${{ needs.dependency-scan-backend.result }}"
          echo "Frontend Dependency Scan: ${{ needs.dependency-scan-frontend.result }}"
          echo "Bandit Scan: ${{ needs.bandit-scan.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "SQL Injection Tests: ${{ needs.sql-injection-tests.result }}"

          # Critical failures (must pass)
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.sql-injection-tests.result }}" == "failure" ]]; then
            echo "::error::Critical security checks failed"
            exit 1
          fi

          # Warnings (informational only)
          if [[ "${{ needs.owasp-zap-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-scan-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-scan-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.bandit-scan.result }}" == "failure" ]]; then
            echo "::warning::Some security scans reported issues. Review reports for details."
          fi

          echo "::notice::Security audit completed. Review all reports for findings."
