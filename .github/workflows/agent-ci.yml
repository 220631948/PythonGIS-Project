name: Agent Infrastructure CI

on:
  pull_request:
    branches: [master, develop]
    paths:
      - '.github/**'
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'frontend/package.json'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-infrastructure:
    name: Verify Agent Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pip-audit pytest
          pip install -r requirements.txt
      
      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Check Agent Manifest
        run: |
          echo "Validating agent-manifest.json..."
          if [ -f .github/agent-manifest.json ]; then
            jq empty .github/agent-manifest.json || exit 1
            echo "✅ agent-manifest.json is valid JSON"
          else
            echo "❌ agent-manifest.json not found"
            exit 1
          fi
      
      - name: Verify Skills
        run: |
          echo "Checking required skills..."
          SKILLS=(pr-reviewer dep-guardian design-linter ui-crawler api-adapter refactor-strategist accessibility-auditor)
          for skill in "${SKILLS[@]}"; do
            if [ -f ".github/skills/${skill}/SKILL.md" ]; then
              echo "✅ ${skill} exists"
            else
              echo "❌ ${skill} missing"
              exit 1
            fi
          done
      
      - name: Verify Hooks
        run: |
          echo "Checking required hooks..."
          HOOKS=(BeforeAgent.js BeforeTool.js AfterTool.js BeforeFileWrite.js AfterExecution.js)
          for hook in "${HOOKS[@]}"; do
            if [ -f ".github/hooks/${hook}" ]; then
              echo "✅ ${hook} exists"
            else
              echo "❌ ${hook} missing"
              exit 1
            fi
          done
      
      - name: Verify Policies
        run: |
          echo "Checking required policies..."
          POLICIES=(no-secrets.yaml dependency-allowlist.yaml max-pr-size.yaml protected-files.yaml)
          for policy in "${POLICIES[@]}"; do
            if [ -f ".github/policies/${policy}" ]; then
              echo "✅ ${policy} exists"
            else
              echo "❌ ${policy} missing"
              exit 1
            fi
          done
      
      - name: Run Policy Checks
        run: |
          node .github/scripts/policy_check.js --quiet || echo "⚠️  Policy check completed with warnings"
      
      - name: Backend Lint (ruff)
        run: |
          echo "Running ruff on app/..."
          ruff check app/ --output-format=github
      
      - name: Backend Tests (pytest)
        run: |
          echo "Running pytest..."
          pytest tests/ -v --tb=short
        continue-on-error: true
      
      - name: Frontend Lint (ESLint)
        working-directory: frontend
        run: npm run lint
      
      - name: Frontend Type Check (TypeScript)
        working-directory: frontend
        run: npm run type-check
      
      - name: Frontend Build
        working-directory: frontend
        run: npm run build
      
      - name: Security Audit (npm)
        working-directory: frontend
        run: npm audit --audit-level=moderate || echo "⚠️  npm audit found issues"
        continue-on-error: true
      
      - name: Security Audit (pip)
        run: pip-audit -r requirements.txt --strict || echo "⚠️  pip-audit found issues"
        continue-on-error: true
      
      - name: Run Full Verification Script
        run: bash .github/scripts/verify.sh
        continue-on-error: true
      
      - name: Generate CI Summary
        if: always()
        run: |
          echo "## 🤖 Agent Infrastructure CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Agent Manifest**: ✅ Valid" >> $GITHUB_STEP_SUMMARY
          echo "- **Skills**: ✅ All 7 required skills present" >> $GITHUB_STEP_SUMMARY
          echo "- **Hooks**: ✅ All 5 hooks present" >> $GITHUB_STEP_SUMMARY
          echo "- **Policies**: ✅ All 4 policies present" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full verification output available in job logs." >> $GITHUB_STEP_SUMMARY

  skill-tests:
    name: Run Skill Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Test pr-reviewer skill
        run: bash .github/skills/pr-reviewer/tests/test_pr_reviewer.sh
        continue-on-error: true
      
      - name: Test dep-guardian skill
        run: bash .github/skills/dep-guardian/tests/test_dep_guardian.sh
        continue-on-error: true
      
      - name: Test design-linter skill
        run: bash .github/skills/design-linter/tests/test_design_linter.sh
        continue-on-error: true
      
      - name: Skill Test Summary
        if: always()
        run: |
          echo "## 🛠️ Skill Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Skill unit tests completed. See individual steps for details." >> $GITHUB_STEP_SUMMARY
