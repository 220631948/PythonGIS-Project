name: Lint and Type Check

# Sprint 4 - S4.3 / G.1.1: Lint & type check workflow
# Runs on every push and PR to ensure code quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pylint

      - name: Run Black (formatter check)
        run: |
          black --check app/ tests/
        continue-on-error: true

      - name: Run Flake8 (linter)
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run MyPy (type checker)
        run: |
          mypy app/ --ignore-missing-imports
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript compiler check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Prettier check
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}"
        continue-on-error: true

  summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ backend-lint, frontend-lint ]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Backend lint: ${{ needs.backend-lint.result }}"
          echo "Frontend lint: ${{ needs.frontend-lint.result }}"

          if [ "${{ needs.backend-lint.result }}" == "failure" ] || [ "${{ needs.frontend-lint.result }}" == "failure" ]; then
            echo "❌ Lint checks failed"
            exit 1
          else
            echo "✅ Lint checks passed"
          fi
