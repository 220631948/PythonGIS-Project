name: CI/CD Pipeline

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Tests and Linting
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --json > npm-audit.json || (cat npm-audit.json && exit 1)

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Backend Tests and Linting
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: kartoza/postgis:15-3.3
        env:
          POSTGRES_USER: geohub_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: geohub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run pip-audit (blocking)
        run: |
          pip install pip-audit
          pip-audit --strict

      - name: Run Ruff linter
        run: ruff check app/

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://geohub_user:test_password@localhost:5432/geohub_test
          TESTING: "true"
        run: pytest tests/ --cov=app --cov-report=xml -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Docker Build Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build --no-cache

  # E2E Tests (only on master/develop)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start services
        run: |
          # Start the API (db will be started as a dependency)
          docker compose up -d api
          docker compose ps
          sleep 10

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:8000

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: frontend/tests/e2e/screenshots/**
