name: Spec Kit Verification (specify check)

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  specify-check:
    name: Run `specify check`
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Attempt to install Specify CLI
        run: |
          python -m pip install --upgrade pip
          # Try to install Specify from the official repository; continue on failure and fallback to presence check.
          pip install git+https://github.com/github/spec-kit.git || true

      - name: Run specify check (or fallback)
        run: |
          echo "Checking for 'specify' CLI..."
          if command -v specify; then
            echo "specify found: $(specify --version || true)"
            echo "Running 'specify check'..."
            specify check
          else
            echo "specify CLI not available; falling back to presence check of .specify files"
            if [ -d ".specify" ] && [ -f ".specify/spec.md" ] && [ -f ".specify/plan.md" ]; then
              echo "Spec Kit artefacts present"
            else
              echo "Spec Kit artefacts missing. Add .specify/spec.md and .specify/plan.md"
              ls -la . || true
              exit 1
            fi
          fi

      - name: Upload specify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specify-artifacts
          path: |
            .specify/spec.md
            .specify/plan.md
            .specify/tasks/*
