# no-secrets.yaml
# Policy: Prevent committing secrets to repository
# Enforced by: BeforeTool and BeforeFileWrite hooks

name: no-secrets
version: 1.0.0
description: Detect and block secrets from being committed
severity: critical

rules:
  - id: high-entropy-string
    description: Detect high-entropy strings that may be secrets
    pattern: "[A-Za-z0-9+/]{32,}"
    entropy_threshold: 4.5
    action: deny
    
  - id: api-key-pattern
    description: Detect API key patterns
    patterns:
      - 'api[_-]?key[\\s:=]+\\S+'
      - 'api[_-]?secret[\\s:=]+\\S+'
      - 'access[_-]?key[\\s:=]+\\S+'
    case_sensitive: false
    action: deny
    
  - id: password-pattern
    description: Detect password assignments
    patterns:
      - 'password[\\s:=]+\\S+'
      - 'passwd[\\s:=]+\\S+'
      - 'pwd[\\s:=]+\\S+'
    case_sensitive: false
    action: warn  # Warn only, may have false positives
    exceptions:
      - "password: '****'"  # Redacted/placeholder passwords OK
      - "password: '{{ .Values.password }}'"  # Template variables OK
    
  - id: token-pattern
    description: Detect authentication tokens
    patterns:
      - 'token[\\s:=]+\\S+'
      - 'bearer[\\s:=]+\\S+'
      - 'jwt[\\s:=]+\\S+'
    case_sensitive: false
    action: deny
    
  - id: database-connection-string
    description: Detect database connection strings with credentials
    patterns:
      - "postgres://.*:.*@"
      - "mysql://.*:.*@"
      - "mongodb://.*:.*@"
    action: deny
    exceptions:
      - "postgres://user:password@localhost"  # Example/placeholder OK
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@"  # Template variables OK
    
  - id: cloud-provider-keys
    description: Detect cloud provider API keys
    patterns:
      - "AKIA[0-9A-Z]{16}"  # AWS Access Key ID
      - "AIza[0-9A-Za-z_-]{35}"  # Google API Key
      - "sk-[A-Za-z0-9]{48}"  # OpenAI API Key
      - 'sentry_dsn[\\s:=]+https?://[^@]+@'  # Sentry DSN
    action: deny
    
  - id: private-key-headers
    description: Detect private key file headers
    patterns:
      - "-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----"
      - "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    action: deny

exceptions_global:
  # Files allowed to contain example secrets (with clear indicators)
  - path: "**/.env.example"
    reason: "Example environment file with placeholder secrets"
  - path: "**/*.md"
    reason: "Documentation may contain redacted examples"
    required_context: "example|placeholder|redacted|<your-"

remediation:
  message: |
    🚨 Secret detected!
    
    The content you're trying to commit contains what appears to be a secret or credential.
    
    Actions to take:
    1. Remove the secret from the code
    2. Use environment variables instead (add to .env, never commit .env)
    3. Update .env.example with placeholder values
    4. If already committed, rotate the secret immediately
    5. Consider using a secret management service (Azure Key Vault, AWS Secrets Manager)
    
    If this is a false positive, add an exception to .github/policies/no-secrets.yaml
    
  references:
    - "https://docs.github.com/en/code-security/secret-scanning"
    - "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_credentials"
