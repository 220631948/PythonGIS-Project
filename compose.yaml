# Cape Town GeoHub - Docker Compose Configuration
# For more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

services:
  # Main application service - FastAPI backend with GIS capabilities
  app:
    build:
      context: .
      target: final
    container_name: cape-town-geohub
    restart: unless-stopped

    # Expose the FastAPI application on port 8000
    ports:
      - "8000:8000"

    # Environment variables for configuration
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000

    # Mount volumes for persistent data
    volumes:
      - geohub-data:/app/data
      - geohub-logs:/app/logs

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: cape-town-geohub-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=geohub
      - POSTGRES_PASSWORD=geohub_password
      - POSTGRES_DB=geohub_db
    volumes:
      - geohub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geohub -d geohub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

# Named volumes for data persistence
volumes:
  geohub-data:
    driver: local
  geohub-logs:
    driver: local
  geohub-db-data:
    driver: local

    # The commented out section below is an example of how to define a PostgreSQL
    # database that your application can use. `depends_on` tells Docker Compose to
    # start the database before your application. The `db-data` volume persists the
    # database data between container restarts. The `db-password` secret is used
    # to set the database password. You must create `db/password.txt` and add
    # a password of your choosing to it before running `docker compose up`.
    #
    # To add a database, uncomment the following and add depends_on to the app service:
    #
    # depends_on:
    #   db:
    #     condition: service_healthy
    #
    # db:
    #   image: postgres:16
    #   restart: always
    #   user: postgres
    #   secrets:
    #     - db-password
    #   volumes:
    #     - db-data:/var/lib/postgresql/data
    #   environment:
    #     - POSTGRES_DB=geohub
    #     - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    #   expose:
    #     - 5432
    #   healthcheck:
    #     test: [ "CMD", "pg_isready" ]
    #     interval: 10s
    #     timeout: 5s
    #     retries: 5
    #
    # db-data:
    #   driver: local
    #
    # secrets:
    #   db-password:
    #     file: db/password.txt
