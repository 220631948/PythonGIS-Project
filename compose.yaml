services:
  db:
    image: kartoza/postgis:15-3.3
    container_name: geohub_postgis
    environment:
      - POSTGRES_USER=geohub
      - POSTGRES_PASS=geohub_password
      - POSTGRES_DB=geohub_db
      - ALLOW_IP_RANGE=0.0.0.0/0
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./cape_town_geohub/scripts/init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geohub -d geohub_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - geohub-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geohub_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://geohub:geohub_password@db:5432/geohub_db
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./cape_town_geohub:/app
      - ./cape_town_geohub/data/cache:/app/data/cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - geohub-network

  frontend:
    build:
      context: ./cape_town_geohub/frontend
      dockerfile: Dockerfile.dev
    container_name: geohub_frontend
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:3000
      - API_PROXY_TARGET=http://api:8000
      - VITE_DEV_PORT=3000
      - VITE_MAP_CENTER=-33.9249,18.4241
      - VITE_MAP_ZOOM=12
    ports:
      - "3000:3000"
    volumes:
      - ./cape_town_geohub/frontend/src:/app/src
      - ./cape_town_geohub/frontend/public:/app/public
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    restart: unless-stopped
    networks:
      - geohub-network

networks:
  geohub-network:
    driver: bridge
