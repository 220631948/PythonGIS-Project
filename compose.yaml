services:
  db:
    image: kartoza/postgis:15-3.4
    container_name: geohub_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?database user required}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_DBNAME: ${POSTGRES_DB:?database name required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_DB: ${POSTGRES_DB:?database name required}
      ALLOW_IP_RANGE: 0.0.0.0/0
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./scripts/init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - ${POSTGRES_USER:-geohub}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - geohub-network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geohub_api
    env_file:
    - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:?err}
    - PYTHONUNBUFFERED=1
    - API_HOST=0.0.0.0
    - API_PORT=8000
    - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    - SENTRY_DSN=${SENTRY_DSN:-}
    - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
    - 8000:8000
    volumes:
    - ./:/app
    - ./data/cache:/app/data/cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
    - geohub-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: geohub_frontend
    env_file:
    - .env
    restart: unless-stopped
    depends_on:
    - api
    environment:
    - VITE_API_URL=http://localhost:8000
    - VITE_MAP_CENTER=-33.9249,18.4241
    - VITE_MAP_ZOOM=12
    - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    - VITE_SENTRY_RELEASE=${SENTRY_RELEASE:-}
    - VITE_SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
    - 5173:5173
    volumes:
    - ./frontend/src:/app/src
    - ./frontend/public:/app/public
    - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
    - geohub-network
networks:
  geohub-network:
    driver: bridge
volumes:
  postgres_data:
    driver: local
