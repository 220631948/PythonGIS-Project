version: '3.8'

services:
  # Backend Service (GIS Engine)
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: geohub-api
    ports:
      - "8000:8000"
    volumes:
      - .:/code  # Host mount for hot reloading
      - /code/data:/code/data # Persist data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - geohub-net
    restart: unless-stopped

  # Frontend Service (UI)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geohub-web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - geohub-net
    restart: unless-stopped

networks:
  geohub-net:
    driver: bridge
