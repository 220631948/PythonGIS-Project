<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Cape Town GeoHub - Consolidated GIS utility for urban planning, service delivery, transport, safety, and environmental analysis" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoHub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cape Town GeoHub" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cape Town GeoHub" />
    <meta property="og:description" content="Explore Cape Town's urban data for planning and research" />
    <meta property="og:url" content="/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Cape Town GeoHub</title>

    <style>
      /* Critical CSS for initial load */
      html, body { margin: 0; padding: 0; height: 100%; }
      #root { height: 100%; }

      /* Loading screen */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f5f6f8;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .app-loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .app-loading-text {
        margin-top: 16px;
        color: #4b5563;
        font-size: 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-color-scheme: dark) {
        .app-loading { background: #0f172a; }
        .app-loading-spinner { border-color: #1f2937; border-top-color: #60a5fa; }
        .app-loading-text { color: #94a3b8; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-C5BKMzoi.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CTAtWnkW.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link" style="
      position: absolute;
      left: -9999px;
      z-index: 9999;
      padding: 1em;
      background: #1e40af;
      color: white;
      text-decoration: underline;
    ">Skip to main content</a>

    <!-- Live region for screen reader announcements -->
    <div id="live-region" aria-live="polite" aria-atomic="true" class="visually-hidden" style="
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    "></div>

    <!-- App root -->
    <div id="root">
      <!-- Loading placeholder shown before React loads -->
      <output class="app-loading">
        <div class="app-loading-spinner" aria-hidden="true"></div>
        <p class="app-loading-text">Loading Cape Town GeoHub...</p>
      </output>
    </div>


    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/'
            });

            console.log('ServiceWorker registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available
                  if (window.confirm('A new version of Cape Town GeoHub is available. Reload to update?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          } catch (error) {
            console.error('ServiceWorker registration failed:', error);
          }
        });

        // Listen for messages from service worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          console.log('Message from SW:', event.data);
        });
      }
    </script>
  </body>
</html>
