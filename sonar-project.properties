# SonarQube Configuration
# "I'm a safety inspector! I wear a hat!"

sonar.projectKey=PythonGIS_Project
sonar.projectName=PythonGIS Project
sonar.sources=app,frontend/src
sonar.tests=tests,frontend/tests
sonar.python.version=3.13
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=node_modules/**, .venv/**, static/**
