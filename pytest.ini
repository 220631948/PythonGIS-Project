# pytest.ini - Pytest configuration for Cape Town GeoHub
[pytest]
# Directories to search for tests
testpaths = tests

# Python file naming patterns for test discovery
python_files = test_*.py *_test.py

# Python class naming patterns for test discovery
python_classes = Test*

# Python function naming patterns for test discovery
python_functions = test_*

# Minimum pytest version required
minversion = 7.0

# Add options for test runs
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Register custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
